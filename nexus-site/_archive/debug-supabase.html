<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Debug</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #fff; }
        .log { margin: 10px 0; padding: 10px; background: #2a2a2a; border-left: 3px solid #666; }
        .log.success { border-color: #4ade80; }
        .log.error { border-color: #ef4444; }
        .log.info { border-color: #60a5fa; }
        .log.warn { border-color: #f59e0b; }
        button { margin: 10px 5px; padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Supabase Connection Debug</h1>
    <button onclick="testConnection()">Test Connection</button>
    <button onclick="checkMembers()">Check Members Table</button>
    <button onclick="checkDepartments()">Check Departments</button>
    <button onclick="checkRoles()">Check Roles</button>
    <div id="logs"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://mowkmkvejtjwwnhvartz.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vd2tta3ZlanRqd3duaHZhcnR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMTEyMDcsImV4cCI6MjEwMDg4NzIwN30.7_HIIBr_FM99sPH-nEUU7aF3KMmQDrt84CV35TIxRHs';

        let supabase;

        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            document.getElementById('logs').appendChild(div);
            console.log(message);
        }

        function initSupabase() {
            try {
                supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                log('Supabase client created', 'success');
                return true;
            } catch (err) {
                log(`Failed to create Supabase client: ${err.message}`, 'error');
                return false;
            }
        }

        async function testConnection() {
            if (!supabase && !initSupabase()) return;

            log('Testing connection...', 'info');
            try {
                const { data, error } = await supabase.from('_test_connection_').select('*').limit(1);
                if (error && error.code === 'PGRST116') {
                    log('Connection successful! (table does not exist error is expected)', 'success');
                } else {
                    log(`Connection result: ${JSON.stringify(data || error)}`, 'info');
                }
            } catch (err) {
                log(`Connection test failed: ${err.message}`, 'error');
            }
        }

        async function checkMembers() {
            if (!supabase && !initSupabase()) return;

            log('Checking members table...', 'info');
            try {
                const { data, error, status, statusText } = await supabase
                    .from('members')
                    .select('*')
                    .limit(10);

                log(`Status: ${status} ${statusText}`, 'info');

                if (error) {
                    log(`Error: ${error.message} (Code: ${error.code})`, 'error');
                    log(`Details: ${JSON.stringify(error)}`, 'error');
                } else {
                    log(`Found ${data?.length || 0} members`, 'success');
                    if (data && data.length > 0) {
                        log(`Sample member: ${JSON.stringify(data[0])}`, 'info');
                    }
                }
            } catch (err) {
                log(`Failed to check members: ${err.message}`, 'error');
            }
        }

        async function checkDepartments() {
            if (!supabase && !initSupabase()) return;

            log('Checking departments table...', 'info');
            try {
                const { data, error, status } = await supabase
                    .from('departments')
                    .select('*');

                log(`Status: ${status}`, 'info');

                if (error) {
                    log(`Error: ${error.message} (Code: ${error.code})`, 'error');
                } else {
                    log(`Found ${data?.length || 0} departments`, 'success');
                    if (data && data.length > 0) {
                        log(`Departments: ${data.map(d => d.name).join(', ')}`, 'info');
                    }
                }
            } catch (err) {
                log(`Failed to check departments: ${err.message}`, 'error');
            }
        }

        async function checkRoles() {
            if (!supabase && !initSupabase()) return;

            log('Checking roles table...', 'info');
            try {
                const { data, error, status } = await supabase
                    .from('roles')
                    .select('*');

                log(`Status: ${status}`, 'info');

                if (error) {
                    log(`Error: ${error.message} (Code: ${error.code})`, 'error');
                } else {
                    log(`Found ${data?.length || 0} roles`, 'success');
                    if (data && data.length > 0) {
                        log(`Roles: ${data.map(r => r.display_name).join(', ')}`, 'info');
                    }
                }
            } catch (err) {
                log(`Failed to check roles: ${err.message}`, 'error');
            }
        }

        // Auto-run on load
        window.addEventListener('DOMContentLoaded', () => {
            log('Debug page loaded', 'info');
            initSupabase();
            testConnection();
            checkDepartments();
            checkRoles();
            checkMembers();
        });
    </script>
</body>
</html>
