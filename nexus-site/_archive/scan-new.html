<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Attendance | TEAM KJSSE ROBOCON</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/styles.css">

    <!-- Runtime Configuration (for development/testing) -->
    <script src="/src/config.js"></script>

    <style>
        .scan-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 20px 40px;
            background: linear-gradient(180deg, var(--primary-bg) 0%, var(--secondary-bg) 100%);
        }

        .scan-container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        .result-card {
            background: var(--tertiary-bg);
            border: 2px solid var(--border-medium);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .result-card.entry {
            border-color: rgba(34, 197, 94, 0.5);
            box-shadow: 0 20px 60px rgba(34, 197, 94, 0.2);
        }

        .result-card.exit {
            border-color: rgba(251, 146, 60, 0.5);
            box-shadow: 0 20px 60px rgba(251, 146, 60, 0.2);
        }

        .result-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
        }

        .result-card.entry::before {
            background: linear-gradient(90deg, #22c55e, #16a34a);
        }

        .result-card.exit::before {
            background: linear-gradient(90deg, #fb923c, #f97316);
        }

        .result-icon {
            font-size: 72px;
            margin-bottom: 24px;
            display: block;
        }

        .result-icon.entry {
            color: #22c55e;
            animation: pulse 2s ease-in-out infinite;
        }

        .result-icon.exit {
            color: #fb923c;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .result-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .result-title.entry {
            color: #22c55e;
        }

        .result-title.exit {
            color: #fb923c;
        }

        .result-member {
            font-family: 'Manrope', sans-serif;
            font-size: 20px;
            color: var(--text-primary);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .result-dept {
            font-family: 'Manrope', sans-serif;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .result-time {
            font-family: 'Manrope', sans-serif;
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .result-duration {
            font-family: 'Manrope', sans-serif;
            font-size: 18px;
            color: var(--accent-primary);
            font-weight: 600;
            margin-bottom: 28px;
        }

        .result-message {
            font-family: 'Manrope', sans-serif;
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .result-actions {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }

        .action-btn {
            flex: 1;
            padding: 14px 24px;
            border-radius: 12px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-smooth);
            border: none;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .action-btn.primary {
            background: linear-gradient(135deg, #991b1b, #dc2626);
            color: white;
        }

        .action-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(220, 38, 38, 0.4);
        }

        .action-btn.secondary {
            background: var(--primary-bg);
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
        }

        .action-btn.secondary:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        .error-card {
            background: var(--tertiary-bg);
            border: 2px solid rgba(239, 68, 68, 0.5);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 20px 60px rgba(239, 68, 68, 0.2);
            text-align: center;
        }

        .error-card i {
            font-size: 64px;
            color: #ef4444;
            margin-bottom: 24px;
            display: block;
        }

        .error-card h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .error-card p {
            font-family: 'Manrope', sans-serif;
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .loading-card {
            background: var(--tertiary-bg);
            border: 2px solid var(--border-medium);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .loading-spinner {
            font-size: 48px;
            color: var(--accent-primary);
            margin-bottom: 24px;
            display: block;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .loading-card h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .loading-card p {
            font-family: 'Manrope', sans-serif;
            font-size: 14px;
            color: var(--text-muted);
        }

        @media (max-width: 480px) {
            .result-card, .error-card, .loading-card {
                padding: 36px 24px;
            }

            .result-title {
                font-size: 28px;
            }

            .result-icon {
                font-size: 60px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar scrolled">
        <img src="/Images/K J Somaiya College of Engineering.png" alt="K J Somaiya College of Engineering" class="navbar-logo-left">
        <div class="navbar-center">
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="departments.html">Departments</a></li>
                <li><a href="team-dynamic.html">Team</a></li>
                <li><a href="sponsors.html">Sponsors</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
        <div class="hamburger">
            <span></span><span></span><span></span>
        </div>
        <img src="/Images/somaiya trust.png" alt="Somaiya Trust" class="navbar-logo-right">
    </nav>

    <section class="scan-page">
        <div class="scan-container">

            <!-- Loading State -->
            <div class="loading-card" id="loading-card">
                <i class="fas fa-circle-notch loading-spinner"></i>
                <h2>RECORDING ATTENDANCE...</h2>
                <p>Please wait while we process your scan</p>
            </div>

            <!-- Result Card (Hidden by default) -->
            <div class="result-card" id="result-card" style="display: none;">
                <i class="fas result-icon" id="result-icon"></i>
                <h1 class="result-title" id="result-title"></h1>
                <p class="result-member" id="result-member"></p>
                <p class="result-dept" id="result-dept"></p>
                <p class="result-time" id="result-time"></p>
                <p class="result-duration" id="result-duration" style="display: none;"></p>
                <p class="result-message" id="result-message"></p>
                <div class="result-actions">
                    <button class="action-btn secondary" id="close-btn">
                        <i class="fas fa-times"></i> Close
                    </button>
                    <a href="dashboard.html" class="action-btn primary">
                        <i class="fas fa-chart-line"></i> Dashboard
                    </a>
                </div>
            </div>

            <!-- Error Card (Hidden by default) -->
            <div class="error-card" id="error-card" style="display: none;">
                <i class="fas fa-exclamation-triangle"></i>
                <h2>PLEASE LOG IN FIRST</h2>
                <p>You need to log in with your PIN before scanning attendance.</p>
                <div class="result-actions">
                    <a href="portal.html" class="action-btn primary" style="display: inline-flex;">
                        <i class="fas fa-arrow-right-to-bracket"></i> Go to Login
                    </a>
                </div>
            </div>

        </div>
    </section>

    <script type="module" src="/src/scan-new.ts"></script>
</body>
</html>
