<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | TEAM KJSSE ROBOCON</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/styles.css">

    <style>
        .portal-page {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary-bg) 0%, var(--secondary-bg) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .portal-container {
            max-width: 420px;
            width: 100%;
        }

        .portal-card {
            background: var(--tertiary-bg);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .portal-logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 24px;
            background: var(--gradient-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: white;
        }

        .portal-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .portal-subtitle {
            font-family: 'Manrope', sans-serif;
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            font-family: 'Manrope', sans-serif;
            font-size: 14px;
        }

        .alert.show {
            display: block;
        }

        .alert.success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .alert.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-family: 'Manrope', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: var(--primary-bg);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 15px;
            font-family: 'Manrope', sans-serif;
            transition: var(--transition-smooth);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 14px 24px;
            background: var(--gradient-primary);
            border: none;
            border-radius: 10px;
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition-smooth);
            letter-spacing: 0.5px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-accent);
        }

        .portal-links {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border-light);
        }

        .portal-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'Manrope', sans-serif;
            font-size: 14px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: var(--transition-smooth);
        }

        .portal-link:hover {
            color: var(--accent-primary);
        }

        .info-box {
            margin-top: 20px;
            padding: 16px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 10px;
        }

        .info-box h4 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #93c5fd;
            margin-bottom: 8px;
        }

        .info-box p {
            font-family: 'Manrope', sans-serif;
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <section class="portal-page">
        <div class="portal-container">
            <div class="portal-card">
                <div class="portal-logo">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <h1 class="portal-title">Admin Portal</h1>
                <p class="portal-subtitle">Enter your admin password to access the dashboard</p>

                <div class="alert" id="login-alert"></div>

                <form id="login-form">
                    <div class="form-group">
                        <label class="form-label">Admin Password</label>
                        <input
                            type="password"
                            id="password-input"
                            class="form-input"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required
                        >
                    </div>
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </button>
                </form>

                <div class="portal-links">
                    <a href="index.html" class="portal-link">
                        <i class="fas fa-arrow-left"></i> Back to Website
                    </a>
                </div>

                <div class="info-box">
                    <h4><i class="fas fa-info-circle"></i> Local Admin System</h4>
                    <p>This is a local admin system that works without a backend. Your data is stored in the browser's localStorage.</p>
                </div>
            </div>
        </div>
    </section>

    <script type="module" src="/src/local-portal.ts"></script>
</body>
</html>
