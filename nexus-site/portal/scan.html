<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop Access Terminal | NEXUS ROBOTICS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Numans:wght@400;700&family=Kanit:wght@400;500;600;700&family=Martel+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/public/styles.css">

    <style>
        /* Scan Terminal Container */
        .scan-terminal {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 20px 40px;
            background: linear-gradient(180deg, var(--primary-bg) 0%, var(--secondary-bg) 100%);
        }

        .terminal-card {
            width: 100%;
            max-width: 420px;
            background: var(--tertiary-bg);
            border: 1px solid var(--border-medium);
            padding: 40px 32px;
            position: relative;
        }

        .terminal-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent-primary);
        }

        /* Terminal Header */
        .terminal-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .terminal-header-label {
            font-family: 'Numans', monospace;
            font-size: 10px;
            color: var(--accent-primary);
            letter-spacing: 3px;
            margin-bottom: 12px;
        }

        .terminal-header-title {
            font-family: 'Kanit', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .terminal-header-subtitle {
            font-family: 'Martel Sans', sans-serif;
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Identity Section */
        .identity-section {
            background: var(--primary-bg);
            border: 1px solid var(--border-light);
            padding: 20px;
            margin-bottom: 32px;
        }

        .identity-label {
            font-family: 'Numans', monospace;
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .identity-name {
            font-family: 'Martel Sans', sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .identity-dept {
            font-family: 'Numans', monospace;
            font-size: 12px;
            color: var(--accent-primary);
        }

        /* Status Indicator */
        .status-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 32px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 12px;
        }

        .status-dot.active {
            background: var(--accent-primary);
            box-shadow: 0 0 12px var(--accent-primary);
        }

        .status-dot.inactive {
            background: var(--text-muted);
        }

        .status-text {
            font-family: 'Numans', monospace;
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 2px;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .action-btn {
            width: 100%;
            padding: 24px 20px;
            border: 1px solid var(--border-light);
            background: var(--primary-bg);
            color: var(--text-primary);
            font-family: 'Kanit', sans-serif;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .action-btn::before {
            content: attr(data-action);
            position: absolute;
            left: 20px;
            font-size: 24px;
        }

        .action-btn .btn-text {
            display: block;
            margin-left: 32px;
        }

        .action-btn.check-in:hover {
            border-color: var(--accent-primary);
            background: rgba(6, 214, 229, 0.05);
        }

        .action-btn.check-out:hover {
            border-color: var(--accent-light);
            background: rgba(93, 229, 236, 0.05);
        }

        .action-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .action-btn:disabled:hover {
            border-color: var(--border-light);
            background: var(--primary-bg);
        }

        /* Alert Messages */
        .terminal-alert {
            padding: 16px;
            border-radius: 4px;
            margin-bottom: 24px;
            font-family: 'Martel Sans', sans-serif;
            font-size: 13px;
            text-align: center;
            display: none;
        }

        .terminal-alert.show {
            display: block;
        }

        .terminal-alert-warning {
            background: rgba(255, 149, 0, 0.1);
            border: 1px solid rgba(255, 149, 0, 0.3);
            color: #ff9500;
        }

        .terminal-alert-error {
            background: rgba(255, 69, 58, 0.1);
            border: 1px solid rgba(255, 69, 58, 0.3);
            color: #ff695c;
        }

        .terminal-alert-success {
            background: rgba(48, 209, 88, 0.1);
            border: 1px solid rgba(48, 209, 88, 0.3);
            color: #30d158;
        }

        /* System Footer */
        .terminal-footer {
            text-align: center;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border-light);
        }

        .terminal-time {
            font-family: 'Numans', monospace;
            font-size: 13px;
            color: var(--accent-primary);
            margin-bottom: 8px;
        }

        .terminal-date {
            font-family: 'Martel Sans', sans-serif;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .terminal-status {
            font-family: 'Numans', monospace;
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 2px;
        }

        .terminal-status::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--accent-primary);
            border-radius: 50%;
            margin-right: 8px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .terminal-card {
                padding: 32px 24px;
            }

            .action-btn {
                padding: 20px 16px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="scan-terminal">
        <div class="terminal-card">
            <div class="terminal-header">
                <div class="terminal-header-label">WORKSHOP ACCESS TERMINAL</div>
                <h1 class="terminal-header-title">NEXUS ROBOTICS</h1>
                <p class="terminal-header-subtitle">System access control and attendance tracking</p>
            </div>

            <div class="terminal-alert terminal-alert-warning" id="warning-alert"></div>
            <div class="terminal-alert terminal-alert-error" id="error-alert"></div>
            <div class="terminal-alert terminal-alert-success" id="success-alert"></div>

            <div class="identity-section">
                <div class="identity-label">IDENTITY VERIFIED</div>
                <div class="identity-name" id="member-name">Loading...</div>
                <div class="identity-dept" id="member-dept">Loading...</div>
            </div>

            <div class="status-indicator">
                <div class="status-dot" id="status-dot"></div>
                <div class="status-text" id="status-text">Checking status...</div>
            </div>

            <div class="action-buttons">
                <button class="action-btn check-in" id="check-in-btn" data-action="+">
                    <span class="btn-text">CHECK IN</span>
                </button>
                <button class="action-btn check-out" id="check-out-btn" data-action="−">
                    <span class="btn-text">CHECK OUT</span>
                </button>
            </div>

            <div class="terminal-footer">
                <div class="terminal-time" id="terminal-time">00:00:00</div>
                <div class="terminal-date" id="terminal-date">Loading...</div>
                <div class="terminal-status">SYSTEM ONLINE</div>
            </div>
        </div>
    </div>

    <script type="module" src="/src/portal-scan.ts"></script>
</body>
</html>
